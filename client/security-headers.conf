# Inkluderas i varje location i nginx.conf.template.
# Egna add_header i en location bryter annars arvet från nivån ovanför.

# Egna skript tillåts. Inline-stilar tillåts för style-attribut
# i redaktionellt innehåll; inline-skript tillåts inte.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS hanteras separat för HTTPS-miljön; lokalt använder vi HTTP.